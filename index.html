<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VigasPro - Diseño de Viga Sísmica (E.060)</title>
  <link rel="stylesheet" href="css/sismica.css">
</head>
<body>
  <header>
    <div class="marca">
      <div class="logo">V</div>
      <div><h1>VigasPro — Diseño de Viga Sísmica (E.060)</h1><small>Creado por el Ing. Dan Oliden</small></div>
    </div>
    <nav>
      <a class="boton" href="simple.html">Viga simple</a>
      <button id="btn_ejemplo">Ejemplo</button>

    <div id="hoja"></div>
    <div id="memoria" hidden></div>
